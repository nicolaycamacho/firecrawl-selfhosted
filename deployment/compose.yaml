name: firecrawl-local

# Official Firecrawl Dockerfiles at the pinned repository revision.
# Only the API is published; dependencies remain on the Compose network.
services:
  api:
    build:
      context: ../apps/api
      args:
        GIT_SHA: 7666c1f9ae8720a6bba271e0f60b6a217f8a5210
    restart: unless-stopped
    environment:
      ENV: local
      HOST: 0.0.0.0
      PORT: 3002
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deployment/scripts/setup-env first}
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      NUQ_WORKER_COUNT: 1
      HARNESS_STARTUP_TIMEOUT_MS: 120000
      BULL_AUTH_KEY: ${BULL_AUTH_KEY:?Run deployment/scripts/setup-env first}
      SENTRY_DSN: ""
      POSTHOG_API_KEY: ""
      OTEL_SDK_DISABLED: "true"
    ports:
      - "127.0.0.1:3302:3002"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
      playwright-service:
        condition: service_healthy
    command: [node, dist/src/harness.js, --start-docker]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3002/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 4g
    cpus: 2
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  playwright-service:
    build: ../apps/playwright-service-ts
    restart: unless-stopped
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: 2
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: 2
    logging: *logging

  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 384m
    logging: *logging

  rabbitmq:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    hostname: firecrawl-rabbitmq
    restart: unless-stopped
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    mem_limit: 768m
    logging: *logging

  nuq-postgres:
    build: ../apps/nuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deployment/scripts/setup-env first}
    command: [postgres, -c, max_wal_size=1GB, -c, min_wal_size=80MB]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    mem_limit: 768m
    logging: *logging

volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
